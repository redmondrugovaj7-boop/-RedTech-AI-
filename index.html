<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedTech AI</title>
    <style>
        body {
            background-color: #11111b;
            color: #cdd6f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        /* Kutia e sfondit që do të mbushet plot me emoji */
        #bg-emojis {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.06; /* E bën mjaftueshëm transparent që mos të pengojë leximin */
            font-size: 24px;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            word-break: break-all;
            line-height: 1.8;
            letter-spacing: 15px; /* Hapësira mes simboleve */
        }

        header {
            background-color: rgba(17, 17, 27, 0.95);
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #ff4a4a;
            border-bottom: 2px solid #ff4a4a;
            text-shadow: 0 0 12px rgba(255, 74, 74, 0.6);
            z-index: 1;
            backdrop-filter: blur(5px);
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1;
        }

        .mesazhi {
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 75%;
            line-height: 1.5;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .ti {
            background: linear-gradient(135deg, #ff4a4a 0%, #b30000 100%);
            color: #ffffff;
            align-self: flex-end;
            font-weight: 500;
            border-bottom-right-radius: 2px;
        }

        .roboti {
            background-color: rgba(49, 50, 68, 0.95);
            color: #cdd6f4;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 74, 74, 0.25);
            backdrop-filter: blur(5px);
        }

        footer {
            background-color: rgba(17, 17, 27, 0.95);
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 2px solid #313244;
            z-index: 1;
            backdrop-filter: blur(5px);
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #45475a;
            background-color: #181825;
            color: #cdd6f4;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #ff4a4a;
            box-shadow: 0 0 8px rgba(255, 74, 74, 0.5);
        }

        button {
            padding: 12px 26px;
            background: linear-gradient(135deg, #ff4a4a 0%, #990000 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(255, 74, 74, 0.2);
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 12px rgba(255, 74, 74, 0.4);
        }
    </style>
</head>
<body>

    <!-- Kjo zonë do të mbushet automatikisht me mijëra emoji -->
    <div id="bg-emojis"></div>

    <header>🔴 RedTech AI 🤖⚡</header>

    <div id="chat-box">
        <div class="mesazhi roboti">Përshëndetje! Unë jam RedTech AI. Si mund t'ju ndihmoj sot? 🚀</div>
    </div>

    <footer>
        <input type="text" id="inputMesazhi" placeholder="Shkruaj diçka shoku... 💬" onkeypress="checkEnter(event)">
        <button onclick="dergo()">Dërgo 🚀</button>
    </footer>

    <script>
        // KJO PJESË E MBUSH SFONDIN PLOT E PËRLOT AUTOMATIKISHT
        window.onload = function() {
            let bg = document.getElementById("bg-emojis");
            let emojit = ["🤖", "⚡", "🎮", "💻", "🔥", "?", "!", "#", "🚀", "✨", "🔴"];
            let tekstipërhapur = "";
            
            // Krijon një cikël që gjeneron 1500 simbole për ta mbuluar tërë ekranin
            for (let i = 0; i < 1500; i++) {
                let randomEmoji = emojit[Math.floor(Math.random() * emojit.length)];
                tekstipërhapur += randomEmoji + " ";
            }
            bg.innerText = tekstipërhapur;
        };

        function checkEnter(event) {
            if (event.key === 'Enter') {
                dergo();
            }
        }

        function dergo() {
            let inputi = document.getElementById("inputMesazhi");
            let teksti = inputi.value.trim();
            if (!teksti) return;

            let chatBox = document.getElementById("chat-box");
            
            chatBox.innerHTML += `<div class="mesazhi ti">${teksti}</div>`;
            inputi.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            fetch('/dergo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mesazhi: teksti })
            })
            .then(res => res.json())
            .then(data => {
                chatBox.innerHTML += `<div class="mesazhi roboti">${data.pergjigja}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(err => {
                chatBox.innerHTML += `<div class="mesazhi roboti">Gabim gjatë lidhjes! ❌</div>`;
            });
        }
    </script>
</body>
</html>
